repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        args: [app/]
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2
          - fastapi>=0.136
          - starlette>=1.0
          - pydantic-settings>=2
          - loguru>=0.7
          - typing-extensions>=4
