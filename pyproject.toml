[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "ios-print-server"
version = "1.0.0"
description = "iOS 云打印服务器"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.0",
    "pywin32>=306",
    "pillow>=10.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.0",
    "textual>=1.0.0",
    "python-multipart>=0.0.18",
]

[project.urls]
Homepage = "https://github.com/panyichen48737/print-server"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "httpx>=0.28"]

[project.scripts]
ios-print-server = "console:main"

[tool.hatch.build]
include = [
    "app/**/*.py",
    "app/**/*.html",
    "app/**/*.css",
    "app/**/*.js",
    "console/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
