[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "ios-print-server"
version = "1.0.0"
description = "iOSPrintServer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.0",
    "pywin32>=306",
    "pillow>=10.0",
    "PyMuPDF>=1.25.5",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.18",
    "watchfiles>=1.0.0",
    "PySide6>=6.8.0",
]

[project.urls]
Homepage = "https://github.com/panyichen48737/print-server"

[project.scripts]
ios-print-server = "launcher:main"

[dependency-groups]
dev = [
    "pytest>=9", "pytest-cov>=7", "pytest-asyncio>=0.25.0", "pytest-xdist>=3",
    "httpx>=0.28", "pyinstaller>=6",
    "ruff>=0.11.0", "mypy>=1.20.2",
    "hypothesis>=6.152.7",
    "pre-commit>=4",
]

[tool.coverage.run]
omit = [
    "app/bootstrap.py",
    "app/resources.py",
    "app/printing/enhancer.py",
]

[tool.hatch.build]
include = [
    "app/**/*.py",
    "app/**/*.html",
    "app/**/*.css",
    "app/**/*.js",
    "gui/**/*.py",
    "launcher/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that start a real daemon process",
    "hypothesis: marks hypothesis property-based tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF", "PERF", "TCH", "PYI", "RET", "RSE", "G"]
ignore = ["E501", "RUF002", "RUF001", "RUF003", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "F841", "RUF059", "F401", "SIM105", "SIM117", "B904", "N803", "PERF203", "PERF401", "SIM222"]
"gui/*" = ["ARG002", "PERF401", "N802", "N815", "RUF012", "TC001", "TC002", "F821"]
"launcher/*" = ["N815", "ARG001"]
"app/printing/backends/*" = ["PERF203"]
"app/services/sse_broadcaster.py" = ["PERF203"]
"app/updater.py" = ["TC003"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
strict_optional = true
ignore_missing_imports = true
files = ["app/", "launcher/"]
