[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ios-print-server"
version = "3.10.12"
description = "iOSPrintServer"
requires-python = ">=3.14.5"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "loguru>=0.7.3",
    "pywin32>=311",
    "pillow>=12.2.0",
    "PyMuPDF>=1.27.2.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.28",
    "watchfiles>=1.1.1",
    "PySide6>=6.11.1",
    "pillow-heif>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/panyichen48737/print-server"

[project.scripts]
ios-print-server = "launcher:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3", "pytest-cov>=7.1.0", "pytest-asyncio>=1.3.0", "pytest-xdist>=3.8.0",
    "httpx>=0.28.1", "pyinstaller>=6.20.0",
    "ruff>=0.15.13", "mypy>=2.1.0",
    "hypothesis>=6.152.7",
    "pre-commit>=4.6.0",
]

[tool.coverage.run]
omit = [
    "app/bootstrap.py",
    "app/resources.py",
    "app/printing/enhancer.py",
    "app/printing/image_merger.py",
]

[tool.hatch.build]
include = [
    "app/**/*.py",
    "app/**/*.html",
    "app/**/*.css",
    "app/**/*.js",
    "gui/**/*.py",
    "launcher/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that start a real daemon process",
    "hypothesis: marks hypothesis property-based tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF", "PERF", "TCH", "PYI", "RET", "RSE", "G"]
ignore = ["E501", "RUF002", "RUF001", "RUF003", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "F841", "RUF059", "F401", "SIM105", "SIM117", "B904", "N803", "PERF203", "PERF401", "SIM222"]
"gui/*" = ["ARG002", "PERF401", "N802", "N815", "RUF012", "TC001", "TC002", "F821"]
"launcher/*" = ["N815", "ARG001"]
"app/printing/backends/*" = ["PERF203"]
"app/services/sse_broadcaster.py" = ["PERF203"]
"app/updater.py" = ["TC003"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
strict_optional = true
ignore_missing_imports = true
files = ["app/", "launcher/"]
