[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ios-print-server"
version = "1.0.0"
description = "iOS 云打印服务器"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.0",
    "pywin32>=306",
    "pillow>=10.0",
    "requests>=2.31",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.0",
    "textual>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/panyichen48737/print-server"
