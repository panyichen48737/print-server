[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "ios-print-server"
version = "1.0.0"
description = "iOS 云打印服务器"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.0",
    "pywin32>=306",
    "pillow>=10.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.0",
    "textual>=1.0.0",
    "python-multipart>=0.0.18",
    "watchfiles>=1.0.0",
    "flet>=0.27.0",
    "typer>=0.15.0",
    "aiosqlite>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/panyichen48737/print-server"

[project.optional-dependencies]
dev = [
    "pytest>=9", "pytest-cov>=7", "pytest-asyncio>=0.25.0", "httpx>=0.28", "pyinstaller>=6",
    "ruff>=0.11.0", "mypy>=1.15.0", "pre-commit>=4.2.0",
    "hypothesis>=6.130.0",
]

[project.scripts]
ios-print-server = "console:main"

[tool.hatch.build]
include = [
    "app/**/*.py",
    "app/**/*.html",
    "app/**/*.css",
    "app/**/*.js",
    "gui/**/*.py",
    "console/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that start a real daemon process",
    "hypothesis: marks hypothesis property-based tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF"]
ignore = ["E501", "RUF002", "RUF001", "RUF003", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "F841", "RUF059", "F401", "SIM105", "SIM117", "B904", "N803"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
strict_optional = true
ignore_missing_imports = true
files = ["app/", "console/"]
