{% extends "admin/base.html" %}
{% set active_page = "logs" %}
{% block page_title %}实时日志{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <span>系统日志</span>
        <div class="log-controls">
            <div class="log-level-filter">
                <select id="levelFilter" style="width: 110px;">
                    <option value="ALL">全部</option>
                    <option value="ERROR">ERROR</option>
                    <option value="WARNING">WARNING</option>
                    <option value="INFO">INFO</option>
                    <option value="DEBUG">DEBUG</option>
                </select>
            </div>
            <div class="log-auto-scroll">
                <label class="toggle-switch">
                    <input type="checkbox" id="autoScrollToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span>自动滚动</span>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="clearLogs()">清除</button>
        </div>
    </div>
    <div class="card-body" style="padding: 0;">
        <div class="log-viewer" id="logViewer">
            <div style="color: var(--text-muted); text-align: center; padding: 40px 0;">
                <div class="spinner"></div>
                <div style="margin-top: 12px;">等待日志...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var logViewer = document.getElementById('logViewer');
    var autoScrollToggle = document.getElementById('autoScrollToggle');
    var levelFilter = document.getElementById('levelFilter');
    var autoScroll = true;
    var allLogs = [];       // all received logs
    var filteredCount = 0;  // count of currently displayed logs

    if (autoScrollToggle) {
        autoScrollToggle.addEventListener('change', function() {
            autoScroll = this.checked;
        });
    }

    logViewer.addEventListener('scroll', function() {
        if (!autoScrollToggle) return;
        var atBottom = logViewer.scrollTop + logViewer.clientHeight >= logViewer.scrollHeight - 40;
        if (!atBottom && autoScrollToggle.checked) {
            autoScroll = false;
            autoScrollToggle.checked = false;
        }
    });

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function getLevelClass(line) {
        if (line.indexOf('ERROR') > -1) return 'ERROR';
        if (line.indexOf('WARNING') > -1 || line.indexOf('WARN') > -1) return 'WARNING';
        if (line.indexOf('DEBUG') > -1) return 'DEBUG';
        return 'INFO';
    }

    function renderLogs() {
        var filterVal = levelFilter ? levelFilter.value : 'ALL';
        var html = '';
        filteredCount = 0;

        // Show latest 500 matching logs
        var start = Math.max(0, allLogs.length - 500);
        for (var i = start; i < allLogs.length; i++) {
            var line = allLogs[i];
            var levelClass = getLevelClass(line);
            if (filterVal !== 'ALL' && levelClass !== filterVal) continue;
            filteredCount++;
            html += '<div class="log-entry">';
            html += '<span class="log-level ' + levelClass + '">' + levelClass + '</span>';
            html += escapeHtml(line);
            html += '</div>';
        }

        if (html === '') {
            if (allLogs.length === 0) {
                logViewer.innerHTML = '<div class="empty-state"><div class="empty-icon">☷</div><p>暂无日志</p></div>';
            } else {
                logViewer.innerHTML = '<div class="empty-state"><div class="empty-icon">☷</div><p>没有匹配的日志（' + filterVal + '）</p></div>';
            }
            return;
        }

        logViewer.innerHTML = html;

        if (autoScroll) {
            logViewer.scrollTop = logViewer.scrollHeight;
        }
    }

    // Level filter change
    levelFilter.addEventListener('change', renderLogs);

    // Listen for SSE log events (from script.js global dispatchWS)
    onWSMessage('log', function(data) {
        if (!data || !data.message) return;
        allLogs.push(data.message);
        // Keep buffer bounded
        if (allLogs.length > 2000) {
            allLogs = allLogs.slice(-1000);
        }
        renderLogs();
    });

    // Fallback: initial load from REST API, then poll if SocketIO fails
    function fetchLogs() {
        fetch('/admin/api/logs?lines=200')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.lines || data.lines.length === 0) return;
                // Only fill if socket hasn't pushed yet
                if (allLogs.length === 0) {
                    allLogs = data.lines;
                    renderLogs();
                }
            })
            .catch(function() {});
    }

    // Initial load
    setTimeout(fetchLogs, 500);

    // If no SSE events arrive within 5s, fall back to polling
    var pollTimer = setTimeout(function() {
        if (allLogs.length === 0) {
            setInterval(fetchLogs, 3000);
        }
    }, 5000);
})();
</script>
{% endblock %}
