<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Server — Vision Pro Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 60px;
  font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
/* Background orb */
body::before {
  content: ''; position: fixed; top: -30%; left: -20%;
  width: 80%; height: 80%;
  background: radial-gradient(ellipse, rgba(0,100,200,0.08) 0%, transparent 70%);
  pointer-events: none;
}
body::after {
  content: ''; position: fixed; bottom: -30%; right: -20%;
  width: 70%; height: 70%;
  background: radial-gradient(ellipse, rgba(100,0,200,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.glass {
  background: rgba(28,28,30,0.6);
  backdrop-filter: blur(40px) saturate(1.2);
  -webkit-backdrop-filter: blur(40px) saturate(1.2);
  border: 0.5px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
}

.window {
  width: 1060px; height: 700px;
  position: relative;
  overflow: hidden;
}

/* 3D depth layers */
.layer-1 { position: absolute; inset: 0; border-radius: 20px; }
.layer-2 { position: absolute; inset: 0; border-radius: 20px; }

/* Deep space background inside window */
.window-bg {
  position: absolute; inset: -20%;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(0,80,200,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(120,0,200,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(200,100,50,0.04) 0%, transparent 40%);
  pointer-events: none;
}

.content {
  position: absolute; inset: 0;
  display: flex;
  border-radius: 20px;
  overflow: hidden;
}

/* Sidebar glass */
.sidebar {
  width: 190px; padding: 16px 10px;
  display: flex; flex-direction: column;
  background: rgba(22,22,24,0.5);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-right: 0.5px solid rgba(255,255,255,0.06);
}

.sidebar-header {
  padding: 4px 12px 16px;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  margin-bottom: 12px;
}

.sidebar-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(0,122,255,0.8), rgba(88,86,214,0.6));
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 8px;
  box-shadow: 0 4px 12px rgba(0,122,255,0.2);
}

.sidebar-title { font-size: 14px; color: rgba(255,255,255,0.9); font-weight: 600; letter-spacing: -0.01em; }
.sidebar-sub { font-size: 11px; color: rgba(255,255,255,0.35); }

.nav-vp {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; margin-bottom: 2px;
  border-radius: 10px;
  font-size: 13px; color: rgba(255,255,255,0.45);
  cursor: pointer; transition: all 0.2s;
}

.nav-vp:hover {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.8);
}

.nav-vp.active {
  background: rgba(0,122,255,0.15);
  color: #40A8FF;
  box-shadow: inset 0 0 0 0.5px rgba(0,122,255,0.2);
}

.main-vp {
  flex: 1; padding: 28px 30px;
  overflow: auto;
}

.page-title-vp {
  font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.95);
  letter-spacing: -0.02em; margin-bottom: 4px;
}

.page-sub-vp { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 24px; }

/* Glass stat cards */
.stats-vp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }

.stat-vp {
  background: rgba(28,28,30,0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.stat-title-vp { font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 4px; }
.stat-value-vp { font-size: 28px; color: rgba(255,255,255,0.95); font-weight: 600; letter-spacing: -0.02em; }
.stat-glow { font-size: 11px; color: #30D158; margin-top: 4px; text-shadow: 0 0 8px rgba(48,209,88,0.3); }

/* Chart glass */
.chart-vp {
  background: rgba(28,28,30,0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px; margin-bottom: 20px;
  height: 160px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.chart-title-vp { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 500; margin-bottom: 4px; }
.chart-sub-vp { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 14px; }

.bottom-vp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.card-vp {
  background: rgba(28,28,30,0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.card-title-vp { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 500; margin-bottom: 14px; }

.printer-vp {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
  font-size: 13px;
}
.printer-vp:last-child { border-bottom: none; }
.printer-name-vp { color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 10px; }
.printer-dot-vp { width: 6px; height: 6px; border-radius: 50%; background: #30D158; box-shadow: 0 0 8px rgba(48,209,88,0.4); }
.printer-dot-vp.off { background: rgba(255,255,255,0.2); box-shadow: none; }
.printer-meta-vp { color: rgba(255,255,255,0.35); font-size: 12px; }

.job-vp {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
  font-size: 13px;
}
.job-vp:last-child { border-bottom: none; }
.job-name-vp { color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 8px; }
.job-dot-vp { width: 4px; height: 4px; border-radius: 50%; }
.job-status-vp {
  font-size: 10px; padding: 2px 8px; border-radius: 4px;
  letter-spacing: 0.03em;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.5);
}
.job-status-vp.done { background: rgba(48,209,88,0.15); color: #30D158; }
.job-status-vp.printing { background: rgba(0,122,255,0.15); color: #40A8FF; }
.job-time-vp { color: rgba(255,255,255,0.25); font-size: 11px; }

/* Glow bars */
.bar-glow { fill: rgba(0,122,255,0.6); filter: url(#glow); }
.bar-glow-bg { fill: rgba(255,255,255,0.03); }
.glow-text { fill: rgba(255,255,255,0.4); font-size: 9px; text-anchor: middle; }
.glow-value { fill: rgba(255,255,255,0.7); font-size: 10px; text-anchor: middle; font-weight: 500; }

/* Status indicator glow */
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #30D158; box-shadow: 0 0 12px rgba(48,209,88,0.5); display: inline-block; }
</style>
</head>
<body>
<div class="window glass">
  <div class="window-bg"></div>
  <div class="content">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-icon">P</div>
        <div class="sidebar-title">Print Server</div>
        <div class="sidebar-sub">v2.4.1</div>
      </div>
      <div class="nav-vp active">⊞ 仪表盘</div>
      <div class="nav-vp">⊡ 快速打印</div>
      <div class="nav-vp">☰ 任务队列</div>
      <div class="nav-vp">◻ 打印机</div>
      <div class="nav-vp">☰ 日志</div>
      <div style="flex:1"></div>
      <div style="padding:12px;border-top:0.5px solid rgba(255,255,255,0.06);margin-top:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span class="status-dot"></span>
          <span style="font-size:12px;color:#30D158;font-weight:500">运行中</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.25)">⚙ 设置</div>
      </div>
    </div>
    <!-- Main -->
    <div class="main-vp">
      <div class="page-title-vp">仪表盘</div>
      <div class="page-sub-vp">打印机与任务总览</div>
      <div class="stats-vp">
        <div class="stat-vp"><div class="stat-title-vp">排队中</div><div class="stat-value-vp">3</div><div class="stat-glow">↑ 12%</div></div>
        <div class="stat-vp"><div class="stat-title-vp">打印中</div><div class="stat-value-vp">2</div></div>
        <div class="stat-vp"><div class="stat-title-vp">今日完成</div><div class="stat-value-vp">28</div><div class="stat-glow">↑ 8%</div></div>
        <div class="stat-vp"><div class="stat-title-vp">成功率</div><div class="stat-value-vp">96%</div><div class="stat-glow">↑ 2%</div></div>
      </div>
      <!-- Chart -->
      <div class="chart-vp" style="height:155px">
        <div class="chart-title-vp">近 7 天打印趋势</div>
        <div class="chart-sub-vp">每日完成量</div>
        <svg width="100%" height="90" viewBox="0 0 720 90">
          <defs>
            <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          {[12,18,8,22,15,28,20].map((v,i)=>{
            const x=35+i*95, h=(v/28)*55;
            return `<g>
              <rect class="bar-glow-bg" x="${x+20}" y="${80-h}" width="24" height="${h}" rx="3"/>
              <rect class="bar-glow" x="${x+20}" y="${80-h}" width="24" height="${h}" rx="3"/>
              <text x="${x+32}" y="${80-h-4}" class="glow-value">${v}</text>
              <text x="${x+32}" y="87" class="glow-text">${i+1}日</text>
            </g>`;
          }).join('')}
        </svg>
      </div>
      <!-- Bottom -->
      <div class="bottom-vp">
        <div class="card-vp">
          <div class="card-title-vp">打印机状态</div>
          <div class="printer-vp"><div class="printer-name-vp"><span class="printer-dot-vp"></span>HP LaserJet M404</div><span class="printer-meta-vp">5 任务</span></div>
          <div class="printer-vp"><div class="printer-name-vp"><span class="printer-dot-vp"></span>Canon LBP226dw</div><span class="printer-meta-vp">2 任务</span></div>
          <div class="printer-vp"><div class="printer-name-vp"><span class="printer-dot-vp off"></span>Brother HL-L2340D</div><span class="printer-meta-vp">空闲</span></div>
        </div>
        <div class="card-vp">
          <div class="card-title-vp">最近任务</div>
          <div class="job-vp"><div class="job-name-vp"><span class="job-dot-vp" style="background:#30D158"></span>report_q3.pdf</div><span class="job-status-vp done">完成</span><span class="job-time-vp">2m</span></div>
          <div class="job-vp"><div class="job-name-vp"><span class="job-dot-vp" style="background:#40A8FF"></span>invoice_8852.xlsx</div><span class="job-status-vp printing">打印中</span><span class="job-time-vp">5m</span></div>
          <div class="job-vp"><div class="job-name-vp"><span class="job-dot-vp" style="background:rgba(255,255,255,0.2)"></span>contract_draft.docx</div><span class="job-status-vp">排队</span><span class="job-time-vp">8m</span></div>
          <div class="job-vp"><div class="job-name-vp"><span class="job-dot-vp" style="background:#FF453A"></span>brochure_v3.pdf</div><span class="job-status-vp done" style="background:rgba(255,69,58,0.15);color:#FF453A">失败</span><span class="job-time-vp">23m</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
