name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'design_demos/**'
      - 'launcher/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'design_demos/**'
      - 'launcher/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（如 v3.9.0）'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
      - name: Check if Python files changed
        id: pycheck
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- '*.py' '*.pyi' '.pre-commit-config.yaml' 'pyproject.toml' 'requirements*.txt')
          else
            CHANGED=$(git diff --name-only HEAD~1 -- '*.py' '*.pyi' '.pre-commit-config.yaml' 'pyproject.toml' 'requirements*.txt' 2>/dev/null || echo "unknown")
          fi
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No Python files changed, skipping lint"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Cache pre-commit environments
        if: steps.pycheck.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
        if: steps.pycheck.outputs.skip != 'true'

  test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: test
      - name: Install dependencies
        run: |
          uv sync --group dev --frozen
          uv pip install --system pytest-cov
      - name: Run tests with coverage
        run: uv run pytest tests/ -n auto --durations=10 --tb=short -m "not integration" --cov=app --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=70
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: build
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Cache PyInstaller build
        uses: actions/cache@v5
        with:
          path: |
            build/
            ~\AppData\Local\pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'scripts/build.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-
      - name: Download latest Scalar API Reference
        shell: bash
        run: |
          for i in {1..3}; do
            curl -sL "https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest/dist/browser/standalone.min.js" -o app/static/scalar.standalone.min.js && break
            sleep 3
          done
      - name: Build with PyInstaller
        run: python scripts/build.py --release
        env:
          RELEASE_VERSION: ${{ github.ref_name || inputs.version }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build update service
        run: python scripts/build_service.py
      - name: Generate update zip SHA256
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $zip = "dist/update-$ver.zip"
          (certutil -hashfile $zip SHA256 | Select-String -NotMatch "SHA256|CertUtil" | ForEach-Object { $_.Line.Trim() }) | Out-File -Encoding utf8 "dist/update-$ver.zip.sha256"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss /DMyAppVersion=$ver
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\iOSPrintServer-Setup-*.exe | Select-Object -First 1
          (certutil -hashfile $installer.FullName SHA256 | Select-String -NotMatch "SHA256|CertUtil" | ForEach-Object { $_.Line.Trim() }) | Out-File -Encoding utf8 dist\iOSPrintServer-Setup.sha256
      - name: Generate update.json manifest
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $zipSha = (Get-Content "dist/update-$ver.zip.sha256").Trim()
          $installer = Get-ChildItem dist\iOSPrintServer-Setup-*.exe | Select-Object -First 1
          $exeSha = (Get-Content "dist/iOSPrintServer-Setup.sha256").Trim()
          $json = @{
            latest_version = $ver
            release_url = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            release_notes = ""
            download_url = @{
              incremental = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/update-$ver.zip"
              full = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/iOSPrintServer-Setup-$ver.exe"
            }
            sha256 = @{
              incremental = $zipSha
              full = $exeSha
            }
          }
          $json | ConvertTo-Json -Compress | Out-File -Encoding utf8 "dist/update.json"
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iOSPrintServer-Setup-${{ github.ref_name }}
          retention-days: 7
          path: |
            dist/iOSPrintServer-Setup-*.exe
            dist/iOSPrintServer-Setup.sha256
            dist/update-*.zip
            dist/update-*.zip.sha256
            dist/update.json
            dist/version_info.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: iOSPrintServer-Setup-${{ github.ref_name }}
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: iOSPrintServer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            iOSPrintServer-Setup-*.exe
            iOSPrintServer-Setup.sha256
            update-*.zip
            update-*.sha256
            version_info.json
      - name: Cleanup old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning up old Actions caches to free storage..."
          gh cache list --json id,ref --jq '.[] | select(.ref | startswith("refs/tags/") and (.ref != "refs/tags/${{ github.ref_name }}")) | .id' \
            | xargs -r -I {} sh -c 'gh cache delete {} && echo "  deleted cache {}"'
      - name: Deploy update manifest to GitHub Pages
        run: |
          mkdir -p gh-pages-deploy
          cp update.json gh-pages-deploy/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./gh-pages-deploy
          keep_files: false
          publish_branch: gh-pages
          enable_jekyll: false
