name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system ruff mypy
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy app/ console/

  lockfile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Verify lock files are up to date
        shell: bash
        run: |
          # Compare ignoring the leading header comment (uv embeds the -o path into it)
          uv pip compile pyproject.toml -o /tmp/requirements.txt --quiet
          uv pip compile pyproject.toml --extra dev -o /tmp/requirements-dev.txt --quiet
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt) || { echo '::error::requirements.txt is stale — run: uv pip compile pyproject.toml -o requirements.txt'; exit 1; }
          diff <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.txt) || { echo '::error::requirements-dev.txt is stale — run: uv pip compile pyproject.toml --extra dev -o requirements-dev.txt'; exit 1; }

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Cache Python packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: uv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=55
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Restore Python packages cache
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: uv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps
      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            build/
            %LOCALAPPDATA%\pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'scripts/build.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-
      - name: Build with PyInstaller
        run: python scripts/build.py --release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
      - name: Generate SHA256 checksum
        run: certutil -hashfile dist\iOSPrintServer.exe SHA256 | findstr /v "SHA256" > dist\iOSPrintServer.exe.sha256
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSPrintServer-${{ github.ref_name }}
          path: |
            dist/iOSPrintServer.exe
            dist/iOSPrintServer.exe.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: iOSPrintServer-${{ github.ref_name }}
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: iOS 云打印服务器 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            iOSPrintServer.exe
            iOSPrintServer.exe.sha256
