name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'design_demos/**'
      - 'launcher/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'design_demos/**'
      - 'launcher/**'
      - '*.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv pip install --system ruff mypy
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy app/

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Cache Python packages
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: uv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short -m "not integration" --cov=app --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=65
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Restore Python packages cache
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: uv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps
      - name: Cache PyInstaller build
        uses: actions/cache@v5
        with:
          path: |
            build/
            %LOCALAPPDATA%\pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'scripts/build.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-
      - name: Download latest Scalar API Reference
        shell: bash
        run: |
          for i in {1..3}; do
            curl -sL "https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest/dist/browser/standalone.min.js" -o app/static/scalar.standalone.min.js && break
            sleep 3
          done
      - name: Build with PyInstaller
        run: python scripts/build.py --release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
      - uses: actions/setup-go@v6
      - name: Build update service
        run: python scripts/build_service.py
      - name: Build incremental update zip
        shell: pwsh
        run: |
          python -c "
          import zipfile, pathlib, os
          dist = pathlib.Path('dist/iOSPrintServer')
          ver = '${{ github.ref_name }}'.lstrip('v')
          skip = {'__pycache__'}
          with zipfile.ZipFile(f'dist/update-{ver}.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in dist.rglob('*'):
                  if not f.is_file(): continue
                  if any(p in f.parts for p in skip): continue
                  zf.write(f, f.relative_to(dist))
          "
      - name: Generate update zip SHA256
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $zip = "dist/update-$ver.zip"
          (certutil -hashfile $zip SHA256 | Select-String -NotMatch "SHA256|CertUtil").Trim() | Out-File -Encoding utf8 "dist/update-$ver.zip.sha256"
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content installer.nsi) -replace '!define PRODUCT_VERSION ".*"', "!define PRODUCT_VERSION `"$ver`"" | Set-Content installer.nsi
          makensis installer.nsi
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\iOSPrintServer-Setup-*.exe | Select-Object -First 1
          (certutil -hashfile $installer.FullName SHA256 | Select-String -NotMatch "SHA256|CertUtil").Trim() | Out-File -Encoding utf8 dist\iOSPrintServer-Setup.sha256
      - name: Generate build manifest
        shell: pwsh
        run: |
          $info = @{
            app_version       = "${{ github.ref_name }}"
            build_date        = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            commit_sha        = "${{ github.sha }}"
            github = @{
              run_id      = "${{ github.run_id }}"
              repo        = "${{ github.repository }}"
              server_url  = "${{ github.server_url }}"
            }
            runner_os         = "${{ runner.os }}"
            python_version    = (python --version 2>&1).ToString().Trim()
            uv_version        = (uv --version 2>&1).ToString().Trim()
            pyinstaller_ver   = (python -c "from importlib.metadata import version; print(version('pyinstaller'))" 2>&1).ToString().Trim()
            pip_packages      = (uv pip list --format=json 2>&1 | ConvertFrom-Json | ForEach-Object { "$($_.name)==$($_.version)" }) -join "; "
            scalar_js_size_kb = [math]::Round((Get-Item "app/static/scalar.standalone.min.js" -ErrorAction SilentlyContinue).Length / 1024, 0)
            actions_checkout  = "v6"
            actions_setup_python = "v6"
            astral_setup_uv   = "v8"
            actions_cache     = "v5"
            actions_upload_artifact = "v7"
            actions_download_artifact = "v8"
            softprops_gh_release = "v3"
          }
          $info | ConvertTo-Json | Out-File -Encoding utf8 dist/version_info.json
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iOSPrintServer-Setup-${{ github.ref_name }}
          path: |
            dist/iOSPrintServer-Setup-*.exe
            dist/iOSPrintServer-Setup.sha256
            dist/update-*.zip
            dist/update-*.zip.sha256
            dist/version_info.json

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: iOSPrintServer-Setup-${{ github.ref_name }}
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: iOS 云打印服务器 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            iOSPrintServer-Setup-*.exe
            iOSPrintServer-Setup.sha256
            version_info.json
      - name: Upload incremental update zip
        run: |
          gh release upload "${{ github.ref_name }}" update-*.zip update-*.sha256
