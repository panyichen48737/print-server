name: Test
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing:skip-covered
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Summary
        if: always()
        run: |
          $total = (Select-String -Path coverage.xml -Pattern 'line-rate="(.*?)"').Matches.Count
          Write-Host "::notice::Tests completed for Python ${{ matrix.python-version }}"
