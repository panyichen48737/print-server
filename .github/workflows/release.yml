name: Build & Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v1.1.0, ...

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 版本来自 RELEASE_VERSION env，不需要完整 git 历史

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            build/
            %LOCALAPPDATA%\pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'scripts/build.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-

      - name: Build with PyInstaller
        run: |
          python scripts/build.py --release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSPrintServer-${{ github.ref_name }}
          path: dist/iOSPrintServer.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: iOSPrintServer-${{ github.ref_name }}
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: iOS 云打印服务器 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            iOSPrintServer.exe
